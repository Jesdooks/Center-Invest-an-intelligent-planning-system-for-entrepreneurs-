<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Отчёт по маршрутам</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { padding: 30px; background: #f8f9fa; }
    .day-header {
      background: #198754; color: #fff;
      padding: 6px 14px; border-radius: 6px;
      margin-top: 24px; font-weight: 600;
    }
    table { background: #fff; }
    .visited { background: #d1e7dd; }
    .not-visited { background: #f8d7da; }
  </style>
</head>
<body>
  <h2 class="mb-4">Отчёт по маршрутам</h2>
  <div id="reportContainer"></div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const main = window.opener;
      const exportData = main?._exportData || [];
      const routeData = main?._routeData || {};
      const container = document.getElementById("reportContainer");

      if (!exportData.length) {
        container.innerHTML = '<p class="text-muted">Нет данных для отображения</p>';
        return;
      }

      // читаем адреса из локального кеша
      const addressCache = JSON.parse(localStorage.getItem("addressCache") || "{}");

      exportData.forEach(dayBlock => {
        const { day, visits } = dayBlock;
        const route = routeData.routes?.find(r => r.day == day);
        const waypoints = route?.waypoints || [];

        // пропускаем, если нет точек
        if (!waypoints.length) return;

        const header = document.createElement("h5");
        header.className = "day-header";
        header.textContent = `День ${day}`;
        container.appendChild(header);

        const table = document.createElement("table");
        table.className = "table table-sm table-bordered align-middle text-center mt-2";

        let tbody = "<tbody>";
        waypoints.forEach((p, i) => {
          const visited = visits[i];
          const rowClass = visited ? "visited" : "not-visited";
          const type = p.level?.toLowerCase() === "vip" ? "VIP" : "Стандарт";

          // достаём адрес — приоритет: waypoint.address → addressCache → lat/lon
          const key = `${p.lat},${p.lon}`;
          const addr = p.address || addressCache[key] || `lat: ${p.lat.toFixed(5)}, lon: ${p.lon.toFixed(5)}`;

          tbody += `
            <tr class="${rowClass}">
              <td>${addr}</td>
              <td>${type}</td>
              <td>${visited ? "✅" : "—"}</td>
            </tr>
          `;
        });
        tbody += "</tbody>";

        table.innerHTML = `
          <thead class="table-success">
            <tr>
              <th>Адрес</th>
              <th>Тип</th>
              <th>Посещено</th>
            </tr>
          </thead>
          ${tbody}
        `;

        container.appendChild(table);
      });
    });
  </script>
</body>
</html>
