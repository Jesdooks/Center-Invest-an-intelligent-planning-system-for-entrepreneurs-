<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="https://api.tomtom.com/maps-sdk-for-web/cdn/5.x/5.53.0/maps/maps.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <script defer src="https://api.tomtom.com/maps-sdk-for-web/cdn/5.x/5.53.0/maps/maps-web.min.js"></script>
    <script defer src="https://api.tomtom.com/maps-sdk-for-web/cdn/5.x/5.53.0/services/services-web.min.js"></script>


    <!-- Custom styles -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <header class="bg-success text-white py-2 px-3 fixed-header">
        <div class="container-fluid d-flex align-items-center justify-content-between flex-wrap position-relative">

            <!-- Лого -->
            <div class="d-flex align-items-center">
                <img src="/static/assets/logo.svg" alt="Route.Invest" height="44" class="me-2">
            </div>

            <!-- Цитата (только для десктопа) -->
            <div class="text-center flex-grow-1 fw-semibold d-none d-lg-block">
                Интеллектуальный маршрут — умная инвестиция во время
            </div>

            <!-- Кнопки авторизации -->
            <div class="auth-buttons d-flex align-items-center gap-2 me-3">
                <button class="btn btn-outline-light btn-sm" data-bs-toggle="modal" data-bs-target="#loginModal">
                    Вход
                </button>
                <button class="btn btn-light btn-sm" data-bs-toggle="modal" data-bs-target="#registerModal">
                    Регистрация
                </button>
            </div>

            <!-- AI переключатель -->
            <div class="ai-toggle d-flex align-items-center gap-2">
                <span class="fw-semibold text-white">AI</span>
                <div class="form-check form-switch m-0">
                    <input class="form-check-input" type="checkbox" id="aiSwitch" checked />
                </div>
            </div>

        </div>
    </header>



    <button id="burgerBtn"
        class="d-lg-none position-absolute top-1 start-0 m-2 btn  p-2 rounded-circle shadow burger-open">
        <span id="burgerIcon">✕</span>
    </button>

    <main class="container-fluid flex-grow-1">

        <div class="row">
            <!-- Левая панель -->
            <div class="col-lg-3 col-md-4 bg-light p-3">
                <div class="bg-body-secondary rounded p-3 shadow-sm">

                    <form id="routeForm" class="d-flex flex-column gap-3 mb-4">
                        <h5 class="fw-semibold fs-5 mb-2 text-dark">Прикрепите датасет</h5>

                        <!-- Блок загрузки файла -->
                        <div id="filePlaceholder"
                            class="position-relative text-center border border-success border-2 rounded bg-white p-5">
                            <input type="file" id="fileInput"
                                class="position-absolute top-0 start-0 w-100 h-100 opacity-0"
                                accept=".csv,.xlsx,.xls,.txt" />
                            <svg width="22" height="19" viewBox="0 0 22 19" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <mask id="path-1-inside-1_6_183" fill="white">
                                    <path d="M0 11.5882H22V19H0V11.5882Z" />
                                </mask>
                                <path
                                    d="M22 19V21H24V19H22ZM0 19H-2V21H0V19ZM22 11.5882H20V19H22H24V11.5882H22ZM22 19V17H0V19V21H22V19ZM0 19H2V11.5882H0H-2V19H0Z"
                                    fill="#348C57" mask="url(#path-1-inside-1_6_183)" />
                                <path
                                    d="M11.7071 0.292899C11.3166 -0.0976254 10.6834 -0.0976253 10.2929 0.292899L3.92893 6.65686C3.53841 7.04738 3.53841 7.68055 3.92893 8.07107C4.31946 8.4616 4.95262 8.4616 5.34315 8.07107L11 2.41422L16.6569 8.07107C17.0474 8.4616 17.6805 8.4616 18.0711 8.07107C18.4616 7.68055 18.4616 7.04738 18.0711 6.65686L11.7071 0.292899ZM11 12.6471L12 12.6471L12 1.00001L11 1.00001L10 1.00001L10 12.6471L11 12.6471Z"
                                    fill="#348C57" />
                            </svg>

                            <p class="mt-2 mb-0 small text-secondary">
                                Перетащите файл сюда<br />или выберите на устройстве
                            </p>
                        </div>

                        <!-- Отображение прикреплённого файла -->
                        <div id="fileInfo"
                            class="d-none align-items-center justify-content-between border border-success border-2 rounded bg-white p-2">
                            <p id="fileName" class="mb-0 text-dark fw-medium small"></p>
                            <button type="button" id="removeFileBtn" class="btn btn-sm text-white px-3"
                                style="background-color: #ff6b6b">
                                Удалить
                            </button>
                        </div>

                        <!-- Выбор периода -->
                        <select id="selectPeriod" class="form-select border-success text-success">
                            <option selected disabled>Выбрать период</option>
                            <option value="1_day">1 день</option>
                            <option value="2_day">2 дня</option>
                            <option value="3_day">3 дня</option>
                            <option value="4_day">4 дня</option>
                            <option value="5_day">5 дней</option>
                            <option value="6_day">6 дней</option>
                            <option value="7_day">7 дней</option>
                        </select>

                        <!-- Геолокация -->
                        <div>
                            <button id="getGeo" type="button" class="btn btn-success w-100 rounded-3 mb-2">
                                Разрешить геолокацию
                            </button>
                            <p id="geoError" class="text-danger small d-none">
                                Упс... Что-то пошло не так! Попробуйте ввести вручную.
                            </p>
                            <input type="text" id="manualAddress" class="form-control border-success rounded-3"
                                placeholder="Введите свой адрес" />
                        </div>

                        <!-- Кнопка отправки -->
                        <button type="submit" class="btn btn-success w-100 rounded-3">
                            Построить маршрут
                        </button>

                        <!-- Сообщение -->
                        <div id="formMessage" class="text-center small text-success d-none mt-2">
                            ✅ Данные успешно отправлены!
                        </div>
                    </form>
                    <div class="table-block d-none">
                        <div class="d-flex gap-4 mb-3">
                            <select id="selectDay" class="form-select border-success text-success">
                                <option selected disabled>Выбрать день</option>
                            </select>
                            <button id="getExportFile" type="button" class="btn text-white rounded-3"
                                style="background-color: #a9733b">
                                Экспортировать
                            </button>
                        </div>

                    <!-- Таблица -->
                        <table id="routeTable" class="table table-sm table-hover align-middle text-center">
                            <thead class="table-success">
                                <tr>
                                    <th>Адрес</th>
                                    <th>Тип</th>
                                    <th>Посещено</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Правая часть (карта) -->
            <div class="col-12 col-lg-9 p-0">
                <div id="map" class="w-100 h-100" style="min-height: 80vh"></div>
            </div>
        </div>
    </main>


    <footer class="bg-success text-white py-2 px-3 mt-auto d-none d-lg-block">
        <div class="container-fluid d-flex align-items-center justify-content-between">
            <!-- Лого -->
            <div class="d-flex align-items-center">
                <img src="/static/assets/logo.svg" alt="Route.Invest" height="32">
            </div>

            <!-- Центр -->
            <div class="text-center flex-grow-1 small">
                © Хакатон 2025
            </div>

            <!-- Пустое место (чтобы выровнять центр) -->
            <div style="width:32px;"></div>
        </div>
    </footer>

    <!-- Модальное окно входа -->
    <div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="loginModalLabel">Вход в систему</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="loginPhone" class="form-label">Номер телефона</label>
                            <input type="tel" class="form-control" id="loginPhone" placeholder="+7 (999) 123-45-67" required>
                        </div>
                        <div class="mb-3">
                            <label for="loginPassword" class="form-label">Пароль</label>
                            <input type="password" class="form-control" id="loginPassword" required>
                        </div>
                        <div id="loginError" class="alert alert-danger d-none" role="alert"></div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="button" class="btn btn-success" id="loginSubmit">Войти</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно регистрации -->
    <div class="modal fade" id="registerModal" tabindex="-1" aria-labelledby="registerModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="registerModalLabel">Регистрация</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="registerForm">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="registerFirstName" class="form-label">Имя</label>
                                <input type="text" class="form-control" id="registerFirstName" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="registerLastName" class="form-label">Фамилия</label>
                                <input type="text" class="form-control" id="registerLastName" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="registerPhone" class="form-label">Номер телефона</label>
                            <input type="tel" class="form-control" id="registerPhone" placeholder="+7 (999) 123-45-67" required>
                        </div>
                        <div class="mb-3">
                            <label for="registerPassword" class="form-label">Пароль</label>
                            <input type="password" class="form-control" id="registerPassword" required>
                        </div>
                        <div class="mb-3">
                            <label for="registerPasswordConfirm" class="form-label">Подтвердите пароль</label>
                            <input type="password" class="form-control" id="registerPasswordConfirm" required>
                        </div>
                        <div id="registerError" class="alert alert-danger d-none" role="alert"></div>
                        <div id="registerSuccess" class="alert alert-success d-none" role="alert"></div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="button" class="btn btn-success" id="registerSubmit">Зарегистрироваться</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Индикатор пользователя -->
    <div id="userInfo" class="d-none">
        <div class="d-flex align-items-center gap-2 me-3">
            <span class="text-white">Привет, <span id="userName"></span>!</span>
            <button class="btn btn-outline-light btn-sm" id="logoutBtn">Выйти</button>
        </div>
    </div>

    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script defer type="module" src="/static/js/main.js"></script>

</body>

</html>
